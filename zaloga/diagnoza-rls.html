<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>GoMushroom — diagnoza dostopa</title>
<style>
body{font-family:ui-monospace,Menlo,monospace;background:#1a1209;color:#f5f0e8;padding:1rem;font-size:13px;line-height:1.5;margin:0}
h2{color:#af8455;font-size:1rem;margin:0 0 .3rem}
p.sub{color:#9a8f82;margin:0 0 1rem;font-size:12px}
.box{background:#241708;border:1px solid rgba(175,132,85,.4);border-radius:8px;padding:.8rem;margin-bottom:.8rem}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;color:#9a8f82;font-weight:400;padding:.2rem .3rem;border-bottom:1px solid rgba(175,132,85,.25)}
td{padding:.25rem .3rem;border-bottom:1px solid rgba(255,255,255,.05);vertical-align:top}
.ok{color:#6cc06c}.err{color:#e07060}.warn{color:#e0a860}.dim{color:#7a6f60}
button{background:#af8455;color:#1a1209;border:none;padding:.6rem 1.1rem;border-radius:6px;font-size:13px;font-family:inherit;cursor:pointer}
.izid{margin-top:.8rem;padding:.7rem;border-radius:6px;font-size:12.5px;line-height:1.6}
.izid.dobro{background:rgba(108,192,108,.12);border:1px solid rgba(108,192,108,.4)}
.izid.slabo{background:rgba(224,112,96,.12);border:1px solid rgba(224,112,96,.45)}
code{background:rgba(255,255,255,.07);padding:.05rem .3rem;border-radius:3px}
</style>
</head>
<body>
<h2>🔐 Diagnoza dostopa do Supabase</h2>
<p class="sub">Vsako tabelo vpraša dvakrat — enkrat s publishable ključem, enkrat s tvojim žetonom — in primerja odgovora.</p>

<div class="box" id="seja">…</div>
<div class="box"><table id="tabela"><thead><tr>
  <th>tabela</th><th>publishable</th><th>tvoj žeton</th></tr></thead><tbody></tbody></table></div>
<div id="izid"></div>
<p><button onclick="tek()">↻ Ponovi</button></p>

<script>
const SB_URL='https://rjscfndegqxuefffsedf.supabase.co';
const SB_KEY='sb_publishable_uehiNqcxrZNZb7dF6wnYcA_Xqxf3eqa';
// Zasebne: samo prijavljeni. Deljene: trgovina brez prijave in zaloga s
// prijavo - tam mora brati oboje. Javne bere trgovina.
//
// Seznam mora ustrezati tistemu, kar aplikaciji res bereta. Ko je manjkal
// gm_dn_mat_tipi, je iz zaloge tiho izginil gumb za embalazo, diagnoza pa je
// kazala, da je vse v redu - tabele, ki je ni na seznamu, ne preveri nihce.
const ZASEBNE=['gm_dn_work_orders','gm_dn_etanol','gm_dn_materiali','gm_dn_oprema',
               'gm_dn_rd','gm_dn_bilanca','gm_dn_gly_zapisi','gm_dn_mat_tipi',
               'gm_dn_koraki','gm_dn_oprema_uporaba','gm_dn_umerjanja',
               'gm_customers','gm_invoices','gm_orders',
               'gm_sale_groups','gm_sale_lines','gm_sale_line_batches',
               'gm_batches','gm_inv_counters','gm_tiers',
               'gm_data','gm_expenses','partner_data'];
const DELJENE=['gm_products','gm_product_variants','gm_settings','gm_reviews'];
const JAVNE=['gm_odprti_nalogi','gm_variant_stock_status'];
const TABELE=[...ZASEBNE,...DELJENE,...JAVNE];

// gm_orders je zasebna namenoma: narocilo sestavi streznik s tajnim kljucem,
// brskalnik nad njo nima bralne pravice. Prej je bila med deljenimi in je
// diagnoza njeno pravilno stanje javljala kot napako.

// Pri gm_reviews trgovina ne sme brati vseh stolpcev - kuponske kode in
// e-naslovi so zunaj (doc/supabase-kuponi-recenzij.sql). "select=*" je tam
// namenoma zavrnjen, zato bi preizkus z njim vsakic lazno javil 401. Vprasamo
// natanko po stolpcih, ki jih trgovina res bere.
const IZBOR={
  gm_reviews:'product_id,product_name,rating,title,body,title_en,body_en,name,status,created_at',
};

function seja(){try{return JSON.parse(localStorage.getItem('gm_sb_session')||'null');}catch(e){return null;}}

// Odgovor beremo iz telesa, ne iz glave Content-Range: ta je pri navzkrižnem
// izvoru viden samo, ce ga streznik izrecno razkrije, in bi tiho odpovedal.
// RLS vrstic ne zavrne z napako, ampak jih odfiltrira - zato je razlika med
// "200 in nic vrstic" ter "401" bistvena in ju je treba lociti.
async function preveri(tabela,zeton){
  try{
    const r=await fetch(`${SB_URL}/rest/v1/${tabela}?select=${IZBOR[tabela]||'*'}&limit=1`,{
      headers:{apikey:SB_KEY,Authorization:'Bearer '+zeton},
    });
    if(!r.ok){
      let m='';try{m=(await r.json()).message||'';}catch(e){}
      return {stanje:'err',txt:String(r.status),opomba:m};
    }
    const vrstice=await r.json().catch(()=>[]);
    const n=Array.isArray(vrstice)?vrstice.length:0;
    // Stevilo dodamo le, ce ga streznik razkrije; sklep sloni na telesu.
    const cr=r.headers.get('content-range')||'';
    const skupaj=cr.includes('/')?cr.split('/')[1]:'';
    return n>0
      ?{stanje:'ok',txt:skupaj?`${skupaj} vrstic`:'bere'}
      :{stanje:'nic',txt:'0 vrstic'};
  }catch(e){return {stanje:'err',txt:'ni povezave',opomba:e.message};}
}

async function tek(){
  const s=seja();
  document.getElementById('seja').innerHTML=s
    ? `<span class="ok">✓ seja obstaja</span> · ${s.email||'brez e-naslova'}<br>
       <span class="dim">poteče ${new Date(s.expires_at).toLocaleString('sl-SI')}</span>`
    : `<span class="err">✕ seje ni</span> — najprej se prijavi v zalogo ali materiale`;

  const tb=document.querySelector('#tabela tbody');
  tb.innerHTML='';
  const izidi=[];
  for(const t of TABELE){
    const a=await preveri(t,SB_KEY);
    const b=s?await preveri(t,s.access_token):{stanje:'dim',txt:'—'};
    izidi.push({t,a,b});
    const c=x=>x.stanje==='ok'?'ok':x.stanje==='nic'?'warn':x.stanje==='err'?'err':'dim';
    tb.insertAdjacentHTML('beforeend',
      `<tr><td>${t}</td><td class="${c(a)}">${a.txt}${a.opomba?`<br><span class="dim">${a.opomba}</span>`:''}</td>
       <td class="${c(b)}">${b.txt}${b.opomba?`<br><span class="dim">${b.opomba}</span>`:''}</td></tr>`);
  }

  // Stanje se od tabele do tabele razlikuje, zato ga presojamo za vsako
  // posebej. Prvi poskus je sklepal s "some()" cez vse skupaj in je pri
  // mesanem stanju - del tabel zaklenjenih, del ne - povedal narobe.
  const el=document.getElementById('izid');
  if(!s){el.innerHTML='';return;}
  const sk={odprte:[],zaklenjene:[],anonOnly:[],nihce:[]};
  izidi.filter(x=>ZASEBNE.includes(x.t)).forEach(({t,a,b})=>{
    const A=a.stanje==='ok',B=b.stanje==='ok';
    if(A&&B)sk.odprte.push(t); else if(!A&&B)sk.zaklenjene.push(t);
    else if(A&&!B)sk.anonOnly.push(t); else sk.nihce.push(t);
  });
  const sez=a=>`<code>${a.join('</code>, <code>')}</code>`;
  const deli=[];
  if(sk.anonOnly.length)deli.push(`<div><strong class="err">Politika vezana na <code>anon</code>:</strong> ${sez(sk.anonOnly)}<br>
    <span class="dim">RLS je vklopljen, a dovoljuje samo publishable ključ — tvoj žeton ne vidi ničesar. To je vzrok za „SB prazno". Popravi z <code>doc/supabase-rls-faza1.sql</code>.</span></div>`);
  if(sk.odprte.length)deli.push(`<div style="margin-top:.55rem"><strong class="warn">Brez zaščite:</strong> ${sez(sk.odprte)}<br>
    <span class="dim">Bere jih tudi publishable ključ, torej kdorkoli. Zaklene jih ista datoteka.</span></div>`);
  if(sk.nihce.length)deli.push(`<div style="margin-top:.55rem"><strong class="warn">Ne bere nihče:</strong> ${sez(sk.nihce)}<br>
    <span class="dim">Ali je tabela prazna ali pa RLS nima nobene politike.</span></div>`);
  if(sk.zaklenjene.length)deli.push(`<div style="margin-top:.55rem"><strong class="ok">Pravilno zaklenjeno:</strong> ${sez(sk.zaklenjene)}</div>`);

  // Deljene tabele mora brati OBOJE - trgovina brez prijave in zaloga z njo.
  const slabeDeljene=izidi.filter(x=>DELJENE.includes(x.t)&&!(x.a.stanje==='ok'&&x.b.stanje==='ok'));
  if(slabeDeljene.length)deli.push(`<div style="margin-top:.55rem"><strong class="err">Deljene tabele, ki jih ne bere oboje:</strong> ${sez(slabeDeljene.map(x=>x.t))}<br>
    <span class="dim">Trgovina jih mora brati brez prijave, zaloga pa s prijavo. Popravi z razdelkom 2c v <code>doc/supabase-rls-faza1.sql</code>.</span></div>`);
  // Javne so poglede in so lahko povsem upraviceno prazne - gm_odprti_nalogi
  // ne vrne nicesar, kadar ni nobenega odprtega naloga. Za napako steje samo
  // zavrnitev; prazen pogled omenimo posebej in blaze.
  const slabeJavne=izidi.filter(x=>JAVNE.includes(x.t)&&x.a.stanje==='err');
  if(slabeJavne.length)deli.push(`<div style="margin-top:.55rem"><strong class="err">Trgovina ne bere:</strong> ${sez(slabeJavne.map(x=>x.t))}<br>
    <span class="dim">Brez tega v trgovini izgine podatek o naslednji seriji ali zalogi.</span></div>`);
  const prazneJavne=izidi.filter(x=>JAVNE.includes(x.t)&&x.a.stanje==='nic');
  if(prazneJavne.length)deli.push(`<div style="margin-top:.55rem"><strong class="dim">Javni pogled brez vrstic:</strong> ${sez(prazneJavne.map(x=>x.t))}<br>
    <span class="dim">Branje deluje, le vrstic ni. Pri <code>gm_odprti_nalogi</code> je to pričakovano, kadar ni odprtega naloga.</span></div>`);

  const vseDobro=sk.zaklenjene.length&&!sk.odprte.length&&!sk.anonOnly.length&&!sk.nihce.length&&!slabeDeljene.length&&!slabeJavne.length;
  el.innerHTML=`<div class="izid ${vseDobro?'dobro':'slabo'}">${deli.join('')}</div>`;
}
tek();
</script>
</body>
</html>
